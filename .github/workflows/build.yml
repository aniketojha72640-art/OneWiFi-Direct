name: Build OneWiFi-Direct APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Prepare Project Files, gradle.properties & Drawable Icon
        run: |
          # Fix root build.gradle.kts filename if needed
          if [ -f "root build.gradle.kts" ]; then
            mv "root build.gradle.kts" "build.gradle.kts"
          fi

          # Create gradle.properties required for Jetpack Compose / AndroidX
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> gradle.properties

          # Prepare drawable directory and icon (1.jpeg / 1.jpg / 1.png)
          mkdir -p app/src/main/res/drawable
          rm -f app/src/main/res/drawable/ic_wifi_5_lock.*
          if [ -f "1.jpeg" ]; then
            cp "1.jpeg" app/src/main/res/drawable/ic_wifi_5_lock.jpg
          elif [ -f "1.jpg" ]; then
            cp "1.jpg" app/src/main/res/drawable/ic_wifi_5_lock.jpg
          elif [ -f "1.png" ]; then
            cp "1.png" app/src/main/res/drawable/ic_wifi_5_lock.png
          else
            cat << 'EOF' > app/src/main/res/drawable/ic_wifi_5_lock.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="32dp"
              android:height="32dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#E4E4E7"
                  android:pathData="M12,3C7.79,3 3.7,4.41 0.38,7C4.41,12.06 7.89,16.37 12,21.5C16.08,16.42 20.24,11.24 23.65,7C20.32,4.41 16.22,3 12,3Z"/>
          </vector>
          EOF
          fi

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: OneWiFi-Direct-APK
          path: app/build/outputs/apk/debug/app-debug.apk
