name: Build OneWiFi-Direct APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Prepare Drawable Folder & Icon
        run: |
          mkdir -p app/src/main/res/drawable
          if [ -f "1.jpeg" ]; then
            cp "1.jpeg" app/src/main/res/drawable/ic_wifi_5_lock.png
          elif [ -f "1.jpg" ]; then
            cp "1.jpg" app/src/main/res/drawable/ic_wifi_5_lock.png
          elif [ -f "1.png" ]; then
            cp "1.png" app/src/main/res/drawable/ic_wifi_5_lock.png
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        uses: gradle/actions/setup-gradle@v3
        with:
          arguments: assembleDebug
